#cloud-config
# Doc Oc VPS provisioning script
# Usage: paste this into the cloud-init user data when creating a VPS,
# or run: sudo bash vps_setup.sh

package_update: true
package_upgrade: true

packages:
  - build-essential
  - curl
  - git
  - pkg-config
  - libssl-dev
  - python3
  - python3-venv
  - python3-pip
  - unzip

runcmd:
  # Install Rust
  - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  - echo 'source $HOME/.cargo/env' >> /home/ubuntu/.bashrc
  # Install uv
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - echo 'export PATH="$HOME/.local/bin:$PATH"' >> /home/ubuntu/.bashrc
  # Create workspace
  - mkdir -p /opt/dococ
  - chown ubuntu:ubuntu /opt/dococ
  # Clone repo (replace with actual repo URL when available)
  # - git clone https://github.com/your-org/dococ.git /opt/dococ
  # Build
  # - cd /opt/dococ && cargo build --release
  # Create venvs
  # - cd /opt/dococ && uv venv .venv-laya --python 3.11
  # - cd /opt/dococ && uv pip install --python .venv-laya/Scripts/python.exe torch onnx onnxruntime transformers safetensors huggingface_hub numpy

final_message: "Doc Oc VPS base setup complete. Clone the repo and build."